<header class="wp-block-template-part">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><p class="wp-block-site-title"><a href="{{ '/' | relative_url }}" rel="home"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a></p>

<div class="wp-block-group is-vertical is-layout-flex wp-container-core-group-is-layout-fe9cc265 wp-block-group-is-layout-flex"><nav class="is-responsive items-justified-left is-vertical wp-block-navigation is-content-justification-left is-layout-flex wp-container-core-navigation-is-layout-2290e706 wp-block-navigation-is-layout-flex" aria-label="Navigation">
  <button aria-haspopup="dialog" aria-label="Open menu" class="wp-block-navigation__responsive-container-open"><svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7.5h16v1.5H4z"></path><path d="M4 15h16v1.5H4z"></path></svg></button>
  <div class="wp-block-navigation__responsive-container has-text-color has-foreground-color has-background has-background-background-color" id="modal-1">
    <div class="wp-block-navigation__responsive-close" tabindex="-1">
      <div class="wp-block-navigation__responsive-dialog">
        <button aria-label="Close menu" class="wp-block-navigation__responsive-container-close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="m13.06 12 6.47-6.47-1.06-1.06L12 10.94 5.53 4.47 4.47 5.53 10.94 12l-6.47 6.47 1.06 1.06L12 13.06l6.47 6.47 1.06-1.06L13.06 12Z"></path></svg></button>
        <div class="wp-block-navigation__responsive-container-content" id="modal-1-content">
          <ul class="wp-block-navigation__container is-responsive items-justified-left is-vertical wp-block-navigation"><ul class="wp-block-page-list">
            {%- for item in site.data.navigation %}
            <li class="wp-block-pages-list__item wp-block-navigation-item open-on-hover-click{% if page.url == item.url %} current-menu-item{% endif %}"><a class="wp-block-pages-list__item__link wp-block-navigation-item__content" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
            {%- endfor %}
          </ul></ul>
        </div>
      </div>
    </div>
  </div>
</nav></div>

<div class="wp-block-columns is-layout-flex wp-container-core-columns-is-layout-28f84493 wp-block-columns-is-layout-flex">
<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:66.66%">
<p class="wp-block-paragraph">{{ site.tagline }}</p>
</div>
<div class="wp-block-column is-layout-flow wp-block-column-is-layout-flow" style="flex-basis:33.33%"></div>
</div>
</div>
</header>
